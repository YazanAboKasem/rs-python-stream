logLevel: info

api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsSegmentCount: 7
hlsSegmentDuration: 1s
# Allow the dashboard domain to fetch HLS (CORS)
hlsAllowOrigin: "*"

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: "*"

# Disable unused protocols to avoid port conflicts (SRT uses UDP 8000 by default)
srt: no
rtmp: no

# ── Recording Configuration ───────────────────────────────────────────────────
record: no
recordPath: ./recordings/%path/%Y-%m-%d/%H-%M-%S
recordFormat: fmp4

paths:
  # ── front (None) — synced from dashboard ──
  cam1:
    source: rtsp://admin:12345@192.168.1.165:8554/0
    sourceProtocol: tcp
    record: yes

  cam1_sub:
    source: rtsp://admin:12345@192.168.1.165:8554/1
    sourceProtocol: tcp
    record: yes

  # ── back (None) — synced from dashboard ──
  cam2:
    source: rtsp://admin:hikvision@12@192.168.1.64:554/Streaming/Channels/101
    sourceProtocol: tcp
    record: yes

  cam2_sub:
    source: rtsp://admin:hikvision@12@192.168.1.64:554/Streaming/Channels/102
    sourceProtocol: tcp
    record: yes

  # ── cam3 (None) — synced from dashboard ──
  cam3:
    source: rtsp://:554/Streaming/Channels/101
    sourceProtocol: tcp
    record: yes

  cam3_sub:
    source: rtsp://:554/Streaming/Channels/102
    sourceProtocol: tcp
    record: yes
