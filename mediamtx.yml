logLevel: info

api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: :8554

hls: yes
hlsAddress: :8888
hlsSegmentCount: 7
hlsSegmentDuration: 1s
# Allow the dashboard domain to fetch HLS (CORS)
hlsAllowOrigin: "*"

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: "*"

# Disable unused protocols to avoid port conflicts (SRT uses UDP 8000 by default)
srt: no
rtmp: no

# ── Recording Configuration ───────────────────────────────────────────────────
record: no
recordPath: ./recordings/%path/%Y-%m-%d/%H-%M-%S
recordFormat: fmp4

paths:
  # ── Camera 1 — 192.168.1.64 ─────────────────────────────────────────────
  cam1:                           # HD  ~2-6 Mbps  (1080p/720p full FPS)
    source: rtsp://admin:hikvision%4012@192.168.1.64:554/Streaming/Channels/101
    sourceProtocol: tcp
    record: yes

  cam1_sub:                       # SD  ~300-800 Kbps  (sub stream from camera)
    source: rtsp://admin:hikvision%4012@192.168.1.64:554/Streaming/Channels/102
    sourceProtocol: tcp

  # ── Camera 2 — 192.168.1.65 ─────────────────────────────────────────────
  cam2:                           # HD  ~2-6 Mbps
    source: rtsp://admin:hikvision%4012@192.168.1.65:554/Streaming/Channels/101
    sourceProtocol: tcp
    record: yes

  cam2_sub:                       # SD  ~300-800 Kbps
    source: rtsp://admin:hikvision%4012@192.168.1.65:554/Streaming/Channels/102
    sourceProtocol: tcp

  # ── Camera 3 — 192.168.1.165 (Rear View — Non-Hikvision) ─────────────────
  # NOTE: this camera's Main (H265) stream has a corrupt bitstream
  # ("invalid DeltaPocS0") that forces the recorder to restart every few
  # seconds, producing 4-second recording files instead of continuous
  # footage. Its Sub (H264) stream is clean, so recording is done from
  # Sub instead. Main is still available live for viewing.
  cam3:                           # Main  (channel /0)
    source: rtsp://admin:12345@192.168.1.165:8554/0
    sourceProtocol: tcp

  cam3_sub:                       # Sub  (channel /1)
    source: rtsp://admin:12345@192.168.1.165:8554/1
    sourceProtocol: tcp
    record: yes